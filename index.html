<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Daily Brew</title>
  <meta name="description" content="Nespresso Vertuo drink recipes sized to the pod you have.">
  <meta name="theme-color" content="#F6EFE4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1512" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- Installable app (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Daily Brew">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </a>
    <a href="#/pods" data-tab="pods">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Pods</span>
    </a>
    <a href="#/drinks" data-tab="drinks">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 8.5h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z M16.5 10h1.5a2.5 2.5 0 0 1 0 5h-1.6 M9 3.5c-.8 1 .8 2 0 3 M12.5 3.5c-.8 1 .8 2 0 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Drinks</span>
    </a>
    <a href="#/favorites" data-tab="favorites">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l2.4 5 5.4.7-4 3.8 1 5.4L12 16.4l-4.8 2.5 1-5.4-4-3.8 5.4-.7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Favorites</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px">The Daily Brew needs JavaScript turned on.</p></noscript>

  <script src="data/pods.js"></script>
  <script src="data/recipes.js"></script>
  <script src="app.js"></script>
</body>
</html>
